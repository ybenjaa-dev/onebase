name: onebase
description: >-
  Firebase for Flutter on MongoDB and S3: offline-first reactive collections,
  realtime sync and file storage, from one package and one tiny backend.
version: 0.3.1
repository: https://github.com/ybenjaa-dev/onebase
topics:
  - mongodb
  - storage
  - offline-first
  - realtime
  - backend

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  sqlite_async: ^0.14.4
  sqlite3: ^3.5.2
  http: ^1.6.0
  uuid: ^4.6.0
  path_provider: ^2.1.6
  path: ^1.9.1
  yaml: ^3.1.3
  args: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
