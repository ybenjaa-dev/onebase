name: mongo_easy
description: >-
  Firebase-like developer experience for MongoDB in Flutter. Offline-first
  reactive collections, one tiny generated backend, no third-party sync service.
version: 0.3.0
repository: https://github.com/soft2scale/mongo_easy
topics:
  - mongodb
  - offline-first
  - sync
  - flutter
  - database

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  sqlite_async: ^0.14.3
  sqlite3_flutter_libs: ^0.5.32
  http: ^1.2.0
  uuid: ^4.5.0
  path_provider: ^2.1.4
  path: ^1.9.0
  yaml: ^3.1.2
  args: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
