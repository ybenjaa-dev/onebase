# mongobase schema — the single source of truth for your collections.
# After editing, re-run:  dart run mongobase:setup
#
# Field types: text, int, double, bool, datetime, json
# A trailing `!` marks a field required: non-nullable on the generated model
# and enforced by the backend.

collections:
  todos:
    owner_field: owner_id
    fields:
      title: text!
      done: bool!
      created_at: datetime
      priority: int
      meta: json
      owner_id: text

  categories:
    shared: true
    fields:
      name: text!
      color: text

# File storage. Buckets follow the same rule as collections: private means
# each user only ever sees their own files.
storage:
  avatars:
    access: private
    max_size: 2MB
    content_types: [image/png, image/jpeg, image/webp]

  brochures:
    access: shared
