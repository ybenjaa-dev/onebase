include: package:flutter_lints/flutter.yaml

analyzer:
  # Written by `flutter pub get`'s analysis_options migration. Every pattern it
  # can add is listed, so the migration is a no-op and never dirties the tree
  # mid-CI — including platform directories this repo does not scaffold.
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - directives_ordering
    - omit_local_variable_types
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
