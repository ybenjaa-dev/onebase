include: package:flutter_lints/flutter.yaml

analyzer:
  # Written by `flutter pub get`'s analysis_options migration; kept in git so
  # the migration is a no-op and never dirties the tree mid-CI.
  exclude:
    - build/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - directives_ordering
    - omit_local_variable_types
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
